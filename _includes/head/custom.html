{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon: letter K as a dot matrix, made 2026-11-26 (template icon replaced) -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>


<!-- Optional skin (custom addition): set `skin:` in _config.yml to paper, folio or columbia -->
{% if site.skin == "paper" %}<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,400;0,500;0,600;1,400&display=swap"/>{% endif %}
{% if site.skin == "folio" %}<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"/>{% endif %}
{% if site.skin == "columbia" %}<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600&display=swap"/>{% endif %}
{% if site.skin %}<link rel="stylesheet" href="{{ base_path }}/assets/css/skins/{{ site.skin }}.css"/>{% endif %}

<!-- Story design (custom addition): fonts + stylesheet, see assets/css/story.css for references -->
<link rel="preload" href="{{ base_path }}/assets/fonts/be-vietnam-pro-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/palettes.css"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/story.css"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/motion.css"/>
<script>window.PALETTES = {{ site.data.palettes | jsonify }};</script>
<script src="{{ base_path }}/assets/js/palette-picker.js"></script>

<!-- end custom head snippets -->
