'A neuro-symbolic hybrid database behind retrieval-augmented generation: an 8B LLM translates, Z3 and SymPy solve.': ['Cơ sở dữ liệu lai thần kinh–biểu tượng làm nền cho RAG: LLM 8B dịch đề bài sang dạng hình thức, Z3 và SymPy giải.', RAGを支えるニューロシンボリックなハイブリッドデータベース：80億パラメータのLLMが問題を形式化し、Z3とSymPyが解きます。]
