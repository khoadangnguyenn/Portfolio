? 'IoT prototype: devices sign readings with ECDSA, a FastAPI backend verifies them, raw data goes to IPFS and its hash to a Solidity contract.'
: ['Nguyên mẫu IoT: thiết bị ký số số liệu đo bằng ECDSA, backend FastAPI xác minh chữ ký, dữ liệu thô lưu lên IPFS còn mã băm ghi vào hợp đồng Solidity.', IoTプロトタイプ：デバイスがECDSAで測定値に署名し、FastAPIバックエンドが検証。生データはIPFSに、そのハッシュはSolidityのコントラクトに保存します。]
'A game-server rental platform in PHP and MySQL: product shop, cart, news with comments, and an admin dashboard.': ['Nền tảng thuê máy chủ game viết bằng PHP và MySQL: cửa hàng sản phẩm, giỏ hàng, tin tức có bình luận và trang quản trị.', PHPとMySQLによるゲームサーバーレンタルプラットフォーム：商品ショップ、カート、コメント付きニュース、管理ダッシュボード。]
? Two bin-packing heuristics, First Fit Decreasing and Best Fit Decreasing, written as policies for a 2D cutting stock Gymnasium environment.
: ['Hai heuristic cho bài toán đóng thùng (bin packing), First Fit Decreasing và Best Fit Decreasing, viết thành chính sách cho môi trường Gymnasium của bài toán cắt vật liệu 2D.', ビンパッキング問題の2つのヒューリスティック、First Fit DecreasingとBest Fit Decreasingを、2次元カッティングストック問題のGymnasium環境向けポリシーとして実装。]
? 'Redone feature analysis for D-LAPA depth injection: Ridge probes, depth alignment and UMAP smoothness on 138,090 LIBERO-10 frame pairs.'
: ['Làm lại phân tích đặc trưng khi thêm độ sâu vào D-LAPA: Ridge probe, độ khớp với độ sâu và độ mượt UMAP trên 138.090 cặp khung hình của LIBERO-10.', 'D-LAPAに深度を加えた場合の特徴量分析のやり直し：LIBERO-10の138,090フレームペアでのRidgeプローブ、深度との整合、UMAPの滑らかさ。']
RGB R² 0.454 to 0.520 with depth features: ['R² của RGB tăng từ 0,454 lên 0,520 khi thêm đặc trưng độ sâu', 深度特徴の追加でRGBのR²が0.454から0.520に向上]
? 'A FastAPI chatbot service for e-commerce: OpenAI assistant replies, MongoDB chat history and token tracking, Facebook Messenger webhook.'
: ['Dịch vụ chatbot FastAPI cho thương mại điện tử: trợ lý OpenAI trả lời, MongoDB lưu lịch sử chat và theo dõi token, webhook Facebook Messenger.', EC向けFastAPIチャットボットサービス：OpenAIアシスタントによる返信、MongoDBでのチャット履歴とトークン管理、Facebook Messengerのwebhook。]
Predicts student pass probability from lab-report logs with LightGBM, XGBoost and CatBoost, stacked and scored by AUPRC.: ['Dự đoán xác suất sinh viên qua môn từ nhật ký bài thí nghiệm bằng LightGBM, XGBoost và CatBoost, ghép bằng stacking và chấm theo AUPRC.', 実験レポートのログから、LightGBM、XGBoost、CatBoostのスタッキングで学生の合格確率を予測し、AUPRCで評価。]
? 'The website of our three-person freelance studio: services, pricing, past work, articles and a client area to follow each project.'
: ['Website của studio freelance ba người: dịch vụ, bảng giá, dự án đã làm, bài viết, và khu vực để khách hàng theo dõi từng dự án.', 3人のフリーランススタジオのWebサイト：サービス、料金、過去の実績、記事、各プロジェクトの進行を確認できるクライアントエリア。]
? 'Django REST backend on MongoDB for HCMUT''s tutor programme: three-role login, password reset, and a landing page fed by API.'
: ['Backend Django REST trên MongoDB cho chương trình Tutor của ĐH Bách khoa: đăng nhập theo ba vai trò, đặt lại mật khẩu, và trang chủ lấy dữ liệu qua API.', HCMUTのチューター制度向けに、MongoDB上で動くDjango RESTバックエンド：3つのロールでのログイン、パスワード再設定、APIのデータを表示するランディングページ。]
? A browser extension popup that checks a pasted URL against Google Safe Browsing and a small blocklist, then shows safe or unsafe.
: ['Popup của tiện ích trình duyệt: đối chiếu URL người dùng dán vào với Google Safe Browsing và một danh sách chặn nhỏ, rồi báo an toàn hay không an toàn.', 貼り付けたURLをGoogle Safe Browsingと小規模なブロックリストで照合し、安全か危険かを表示するブラウザ拡張のポップアップ。]
A Java service that pulls stock prices from HOSE and HNX adapters and pushes them to alert, real-time and ticker views.: ['Dịch vụ Java lấy giá cổ phiếu từ các adapter HOSE và HNX, rồi đẩy tới các màn hình cảnh báo, thời gian thực và bảng giá chạy.', HOSEとHNXのアダプタから株価を取得し、アラート、リアルタイム、ティッカーの各画面に配信するJavaサービス。]
'C simulation of an OS: a 140-level multi-level queue scheduler on several CPUs, paged memory with swap, and system calls.': ['Mô phỏng hệ điều hành bằng C: bộ lập lịch hàng đợi đa mức 140 mức trên nhiều CPU, bộ nhớ phân trang có swap, và các lời gọi hệ thống.', C言語によるOSのシミュレーション：複数CPU上の140段階のマルチレベルキュースケジューラ、スワップ付きページングメモリ、システムコール。]
12 test configurations, each with a saved output: ['12 cấu hình kiểm thử, mỗi cấu hình đều có kết quả đã lưu', 12のテスト構成、それぞれ出力を保存]
? 'Text-to-frame video search for Vietnamese content: CLIP embeddings, FAISS index, OCR-aware filtering, FastAPI backend and React frontend.'
: ['Tìm video từ câu mô tả đến từng khung hình cho nội dung tiếng Việt: embedding CLIP, chỉ mục FAISS, lọc có tính đến OCR, backend FastAPI và frontend React.', ベトナム語コンテンツ向けに、テキストでフレーム単位の動画検索ができるシステム：CLIP埋め込み、FAISSインデックス、OCRを考慮したフィルタ、FastAPIバックエンドとReactフロントエンド。]
? 'Network programming assignment: a threaded HTTP backend, a round-robin reverse proxy and two peer-to-peer chats on raw Python sockets.'
: ['Bài tập lập trình mạng: backend HTTP đa luồng, reverse proxy round-robin và hai ứng dụng chat peer-to-peer trên socket Python thuần.', ネットワークプログラミング課題：マルチスレッドHTTPバックエンド、ラウンドロビン方式のリバースプロキシ、Pythonのソケットだけで作った2つのP2Pチャット。]
